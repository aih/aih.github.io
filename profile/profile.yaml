about_draft: |-
  I help legal and government organizations modernize with AI, structured data, and modern software engineering. 

  As founder of DreamProIT, I direct a US/Ukrainian engineering team delivering full-stack, cloud, and AI-driven software for legal, civic tech, and enterprise clients. As a longtime innovation lead in legal technology, I helped the U.S. House Office of the Clerk, House Office of Legislative Counsel, Law Revision Counsel, and GPO introduce XML-based legislative drafting and automated document comparison — including a U.S. patent (20190354636) for comparing hierarchical legislative texts, and work recognized by the House Select Committee on the Modernization of Congress.

  I write and speak on AI in legislatures and parliaments (co-author, Guidelines for AI in Parliaments), and teach lawyers, legislators, and other professionals the fundamentals of AI — how LLMs work, what they do well, and where they fail. I'm always glad to connect with people working on legal tech, GovTech, AI policy, or building engineering teams with Ukraine.

Reach out: arihershowitz@dreamproit.com

